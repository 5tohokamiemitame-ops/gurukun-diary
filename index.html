<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ぐるくん日記">
<meta name="theme-color" content="#5BBFBF">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>ぐるくん日記</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;700&family=Shippori+Mincho:wght@400;600&display=swap');

  :root {
    --sea: #5BBFBF; --deep: #2E8B8B; --light: #A8DEDE; --pale: #E0F5F5;
    --foam: #F0FAFA; --ink: #2C3E40; --mist: #8ABABA;
    --coral: #F4A087; --coral-deep: #C87060; --coral-pale: #FFF0EC;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body { background:var(--foam); color:var(--ink); font-family:'Zen Kaku Gothic New',sans-serif; font-weight:300; min-height:100vh; overflow-x:hidden; }

  #splash { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; background:linear-gradient(180deg,#A8E6E6 0%,var(--sea) 55%,var(--deep) 100%); position:relative; overflow:hidden; }

  .sp-bubble { position:absolute; border-radius:50%; background:rgba(255,255,255,0.2); animation:sprise linear infinite; pointer-events:none; }

  @keyframes sprise { 0%{transform:translateY(100vh);opacity:0;} 15%{opacity:0.7;} 85%{opacity:0.3;} 100%{transform:translateY(-100px);opacity:0;} }

  .gurukun-logo { font-size:80px; animation:logoswim 4s ease-in-out infinite; margin-bottom:20px; filter:drop-shadow(0 4px 20px rgba(0,0,0,0.2)); }

  @keyframes logoswim { 0%,100%{transform:translateX(0) rotate(0deg);} 25%{transform:translateX(10px) rotate(3deg);} 75%{transform:translateX(-10px) rotate(-3deg);} }

  .app-title { font-family:'Shippori Mincho',serif; font-size:36px; color:white; font-weight:600; letter-spacing:4px; text-shadow:0 2px 16px rgba(0,0,0,0.25); margin-bottom:12px; }
  .app-sub { font-size:14px; color:rgba(255,255,255,0.95); letter-spacing:4px; margin-bottom:56px; font-weight:600; }

  .chapter-list { display:flex; flex-direction:column; gap:12px; width:100%; max-width:320px; padding:0 24px; }

  .chapter-btn { background:rgba(255,255,255,0.22); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,0.5); border-radius:16px; padding:18px 24px; color:white; font-family:'Shippori Mincho',serif; font-size:17px; font-weight:600; letter-spacing:2px; cursor:pointer; text-align:left; display:flex; align-items:center; gap:12px; width:100%; transition:all 0.2s; text-shadow:0 1px 4px rgba(0,0,0,0.2); }
  .chapter-btn:active { transform:scale(0.97); background:rgba(255,255,255,0.28); }
  .chapter-btn:disabled { opacity:0.4; cursor:default; }
  .ch-num { font-size:11px; letter-spacing:2px; color:rgba(255,255,255,0.95); font-family:'Zen Kaku Gothic New',sans-serif; font-weight:700; }
  .ch-arrow { margin-left:auto; opacity:0.6; font-size:14px; }

  #chapter-view { display:none; min-height:100vh; }

  .ch-header { background:linear-gradient(180deg,#A8E6E6 0%,var(--sea) 60%,var(--deep) 100%); padding:48px 24px 56px; text-align:center; position:relative; overflow:hidden; }

  .back-btn { position:absolute; top:16px; left:16px; background:rgba(255,255,255,0.2); border:1px solid rgba(255,255,255,0.4); border-radius:20px; padding:6px 14px; color:white; font-size:13px; cursor:pointer; letter-spacing:1px; z-index:10; }

  .ch-label { font-size:11px; letter-spacing:3px; color:rgba(255,255,255,0.95); margin-bottom:10px; font-weight:600; }
  .ch-title-text { font-family:'Shippori Mincho',serif; font-size:22px; color:white; font-weight:600; line-height:1.5; text-shadow:0 2px 8px rgba(0,0,0,0.15); }

  .ch-content { max-width:680px; margin:0 auto; padding:24px 20px 80px; }

  .chapter-summary { background:white; border-radius:20px; padding:24px 28px; margin-bottom:28px; box-shadow:0 2px 16px rgba(91,191,191,0.1); border-left:4px solid var(--sea); }
  .summary-title { font-family:'Shippori Mincho',serif; font-size:17px; color:var(--deep); font-weight:600; margin-bottom:12px; }
  .summary-text { font-size:14px; line-height:2; color:var(--ink); }

  .story-flow { display:flex; flex-direction:column; }
  .pair-number { text-align:center; font-size:13px; letter-spacing:4px; color:#5AAFAF; font-weight:700; padding:20px 0 8px; }

  .diary-card { border-radius:16px; padding:18px 20px; margin-bottom:4px; cursor:pointer; transition:all 0.2s; display:flex; align-items:center; gap:14px; }
  .diary-card:active { transform:scale(0.98); }
  .diary-card.yusuke { background:white; border-left:4px solid var(--sea); box-shadow:0 2px 12px rgba(91,191,191,0.1); }
  .diary-card.oyuki { background:white; border-left:4px solid var(--coral); box-shadow:0 2px 12px rgba(244,160,135,0.1); margin-left:20px; }

  .card-badge { border-radius:10px; padding:5px 10px; font-size:10px; font-weight:700; letter-spacing:1px; flex-shrink:0; text-align:center; min-width:52px; }
  .yusuke .card-badge { background:var(--pale); color:var(--deep); }
  .oyuki .card-badge { background:var(--coral-pale); color:var(--coral-deep); }
  .card-sender { font-size:11px; letter-spacing:1px; margin-bottom:2px; font-weight:600; }
  .yusuke .card-sender { color:var(--deep); }
  .oyuki .card-sender { color:#D4907A; }
  .card-info { flex:1; }
  .card-title { font-family:'Shippori Mincho',serif; font-size:14px; color:var(--ink); font-weight:600; margin-bottom:2px; line-height:1.4; }
  .card-theme { font-size:12px; color:#4A9090; line-height:1.4; font-weight:400; }
  .oyuki .card-theme { color:#C07060; opacity:1; }
  .card-arrow { font-size:13px; flex-shrink:0; opacity:0.4; }

  .connector { width:2px; height:16px; background:linear-gradient(180deg,var(--sea),var(--coral)); margin:0 auto 0 34px; opacity:0.3; }

  .summary-card { background:linear-gradient(135deg,#E8F8F8,#FFF0EC); border-radius:20px; padding:28px; margin-top:20px; border:1px solid rgba(168,216,216,0.3); }
  .summary-card-title { font-family:'Shippori Mincho',serif; font-size:17px; color:var(--deep); font-weight:600; margin-bottom:14px; }
  .summary-card-text { font-size:14px; line-height:2.1; color:var(--ink); }

  #diary-view { display:none; min-height:100vh; padding-bottom:120px; }

  .diary-header { padding:48px 24px 56px; text-align:center; position:relative; overflow:hidden; }
  .diary-content-area { max-width:680px; margin:0 auto; padding:0 20px 32px; }

  .entry-card { background:white; border-radius:16px; padding:24px; margin:16px 0; box-shadow:0 2px 14px rgba(91,191,191,0.08); position:relative; overflow:hidden; }
  .entry-card.yusuke::before { content:''; position:absolute; top:0; left:0; width:100%; height:3px; background:linear-gradient(90deg,var(--sea),var(--light)); }
  .entry-card.oyuki::before { content:''; position:absolute; top:0; left:0; width:100%; height:3px; background:linear-gradient(90deg,var(--coral),#F5C5A8); }

  .entry-section-label { font-size:11px; letter-spacing:2px; text-transform:uppercase; margin-bottom:8px; font-weight:600; }
  .entry-card.yusuke .entry-section-label { color:var(--deep); }
  .entry-card.oyuki .entry-section-label { color:var(--coral-deep); }
  .entry-text { font-size:15px; line-height:2.1; color:var(--ink); }

  .entry-quote { border-left:3px solid; border-radius:0 12px 12px 0; padding:18px 20px; margin:14px 0; font-family:'Shippori Mincho',serif; font-size:15px; font-weight:600; line-height:1.9; }
  .entry-quote.yusuke { border-color:var(--sea); background:linear-gradient(135deg,var(--pale),#F0FAF5); color:var(--deep); }
  .entry-quote.oyuki { border-color:var(--coral); background:linear-gradient(135deg,var(--coral-pale),#FFF8F5); color:var(--coral-deep); }

  .wave-line { text-align:center; color:var(--light); font-size:16px; letter-spacing:4px; margin:16px 0; opacity:0.5; }

  .diary-nav { position:fixed; bottom:0; left:0; right:0; background:rgba(255,255,255,0.95); backdrop-filter:blur(12px); border-top:1px solid var(--pale); display:flex; align-items:center; gap:8px; padding:12px 16px 28px; z-index:100; }

  .nav-side-btn { flex:1; border-radius:14px; padding:14px 12px; font-family:'Shippori Mincho',serif; font-size:13px; font-weight:600; cursor:pointer; transition:all 0.2s; border:none; display:flex; align-items:center; gap:6px; }
  .nav-prev { background:var(--pale); color:var(--deep); justify-content:flex-start; }
  .nav-prev:active { background:var(--light); }
  .nav-next { background:var(--sea); color:white; justify-content:flex-end; }
  .nav-next:active { background:var(--deep); }
  .nav-next.oyuki-next { background:var(--coral); }
  .nav-next.oyuki-next:active { background:var(--coral-deep); }
  .nav-list-btn { background:transparent; border:1px solid var(--light); border-radius:14px; padding:14px 14px; color:var(--mist); font-size:18px; cursor:pointer; flex-shrink:0; }
  .nav-list-btn:active { background:var(--pale); }
  .nav-side-btn:disabled { opacity:0.3; cursor:default; }
</style>
</head>
<body>

<div id="splash">
  <div id="splashBubbles"></div>
  <div class="gurukun-logo">🐟</div>
  <div class="app-title">ぐるくん日記</div>
  <div class="app-sub">ゆうすけ × おゆき</div>
  <div class="chapter-list">
    <button class="chapter-btn" onclick="showChapter()">
      <div><div class="ch-num">CHAPTER 1</div>シンクロニシティ</div>
      <div class="ch-arrow">›</div>
    </button>
    <button class="chapter-btn" onclick="showChapter2()" style="border:2px solid rgba(217,101,76,0.85);box-shadow:0 0 10px rgba(217,101,76,0.25);">
      <div><div class="ch-num">CHAPTER 2</div>寄り道</div>
      <div class="ch-arrow">›</div>
    </button>
  </div>
</div>

<div id="chapter-view">
  <div class="ch-header">
    <div id="chBubbles"></div>
    <button class="back-btn" onclick="showSplash()">← 戻る</button>
    <div class="ch-label">CHAPTER 1</div>
    <div class="ch-title-text">シンクロニシティ</div>
  </div>
  <div class="ch-content">
    <div class="chapter-summary">
      <div class="summary-title">🌊 第一章の旅について</div>
      <div class="summary-text">カラメルが嫌いという共通点から始まり、予知夢、巫女と審神者、聖域、特別な鏡、川の哲学——11回の往復を経て、2人がたどり着いた言葉は「早く抱かせてくれ❤️」だった。言葉にならない何かが、そこにある。</div>
    </div>
    <div class="story-flow" id="storyFlow"></div>
  </div>
</div>


<div id="ch2-list-view" style="display:none;min-height:100vh;">
  <div class="ch-header">
    <div id="ch2ListBubbles"></div>
    <button class="back-btn" onclick="showSplash()">← 戻る</button>
    <div class="ch-label">CHAPTER 2</div>
    <div class="ch-title-text">寄り道</div>
  </div>
  <div class="ch-content">
    <div class="chapter-summary">
      <div class="summary-title">🌊 第二章の旅について</div>
      <div class="summary-text">与那国への旅立ちと不安から始まった2ヶ月。港と船、月と太陽、サクラマスとヤマメ——ふたりで同時にそれぞれの課題を乗り越えた。まぐあいの神聖さ、父上への後悔の浄化、心の服を身体ごと全部脱ぐこと。伊是名島から始まり、伊是名島で完。</div>
    </div>
    <div class="story-flow" id="storyFlow2"></div>
  </div>
</div>

<div id="ch2-diary-view" style="display:none;min-height:100vh;background:#e6f7f9;">
  <div style="position:sticky;top:0;z-index:100;background:rgba(30,107,120,0.95);padding:10px 16px;display:flex;align-items:center;gap:12px;">
    <button onclick="backToCh2List()" style="background:rgba(255,255,255,0.2);border:none;color:white;padding:6px 14px;border-radius:999px;font-size:0.85rem;cursor:pointer;">← 一覧</button>
    <div id="ch2DiaryLabel" style="color:#a8dde6;font-size:0.78rem;letter-spacing:0.05em;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></div>
  </div>
  <div id="ch2DiaryContainer" style="width:100%;overflow-y:auto;padding-bottom:80px;"></div>
  <div class="diary-nav" style="position:fixed;bottom:0;left:0;right:0;">
    <button class="nav-side-btn nav-prev" id="ch2NavPrev" onclick="ch2Prev()">‹ 前へ</button>
    <button class="nav-list-btn" onclick="backToCh2List()">☰</button>
    <button class="nav-side-btn nav-next" id="ch2NavNext" onclick="ch2Next()">次へ ›</button>
  </div>
</div>
<div id="diary-view">
  <div class="diary-header" id="diaryHeader">
    <div id="diaryBubbles"></div>
    <button class="back-btn" onclick="showChapter()">← 一覧</button>
    <div class="ch-label" id="diaryLabel"></div>
    <div class="ch-title-text" id="diaryTitle"></div>
  </div>
  <div class="diary-content-area" id="diaryContent"></div>
  <div class="diary-nav">
    <button class="nav-side-btn nav-prev" id="navPrev" onclick="goPrev()">‹ 前へ</button>
    <button class="nav-list-btn" onclick="showChapter()" title="一覧">☰</button>
    <button class="nav-side-btn nav-next" id="navNext" onclick="goNext()">次へ ›</button>
  </div>
</div>

function decodeB64(str){
  const bin=atob(str);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

  container.innerHTML=decodeB64(entry.b64);

  const next=document.getElementById('ch2NavNext');
  prev.disabled=ch2Idx===0;

    next.disabled=true; next.textContent='✨ 第二章 完！';

    {label:'予知夢のこと', text:'予知夢やいろんな勘は子供の頃から当たり前のことで、けど大人になるにつれてみんながみんなそうじゃないのかと思って話す人を選ぶようにもなった。「おゆきならあり得るよね〜」って即思えたって書いてくれてたの、すごく嬉しかった。ゆうすけ先生にはなぜか安心してそのまましゃべれるんだ。いつも突然何か言っても受け止めてくれる柔らかくたくましくあたたかい存在。'},
    {label:'巫女と審神者', text:'「審神者」って言葉、初めて聞いた。でも読んだ瞬間、「あ、ぴったりだ」って思った。どちらが欠けても成立しない、って書いてくれた言葉、わたしにとってもそうだよ。'},
    {label:'スイッチオフのこと', text:'ゆうすけ先生のアンテナが今はオフ中って書いてくれてたのを読んですごくわかるぅってなったの。だってやだもん、怖いもん。与那国に歯科診療所を開くのだ👽には笑っちゃった笑 ほんとそうよね、突拍子もないこというから。笑<br><br>今はわたしのアンテナに寄り添いたいって言ってくれること——とても嬉しいし、素直に「寄り添ってくれぇ♡」って思ったよ笑。'},
    {quote:'こうして言葉を交わすたびに、心地よく何かが深まっている感覚があるよ'},

  y04:{ label:'YUSUKE / #04', title:'また起きた——言語シンクロニシティ', sections:[
    {label:'また起きた', text:'今日から韓国語の学習を始めたんだよ。英語と並行して。そうしたら——おゆきも今日、同じことを思ってたんだって。「韓国語は習得しやすい→英語と並行しよう」という結論まで一致。もうわけがわからないww'},
    {quote:'シンクロニシティについて語る交換日記の中で、またシンクロが起きた。'},
    {label:'きっかけは違うのに、結論が同じ', text:'ゆうすけ：カズランゲージさんのYouTubeで「言語で世界を広げたい」と思った。韓国語は日本語と構造が近く習得しやすい→先にモノにして英語への自信にしよう。<br><br>おゆき：那覇で英語・韓国語の会話に触れる機会が多かった。以前「韓国語は覚えやすい」と聞いていたことをふと思い出して→なら英語と並行してやろう、という軽いノリで。'},
    {quote:'インプットは違う。プロセスも違う。でも同じ日に、同じ結論に着地した。'},
    {label:'2人の言語観', text:'ゆうすけの答え：いろんな人種の人と、その人の母語で話せたら素敵だと思う。英語という共通語ではなく、相手の言語に自分が入っていく。<br><br>おゆきの答え：今まで触れてこなかった世界に触れることで、外側の世界も自分の内側の世界もどちらも広がるイメージ。言語は自分を知るきっかけにもなる。'},
    {quote:'2人合わせると「言語は外の世界への扉であり、同時に自分の内側への扉でもある」という一つの哲学になる。'},
    {label:'蔵人より', text:'ゆうすけさんが「相手の母語で話す」を選ぶのは、歯科医として根本療法を選ぶのと同じ哲学だと思う。表面的な共通語ではなく、相手の深いところに入っていく。別々の場所・体験から同じ結論に着地するのは情報場の共鳴。今回もまた。'},
  ]},
  o04:{ label:'OYUKI / #04', title:'矢印の方向が違うだけで向かう先は同じ', oyuki:true, sections:[
    {label:'また同じ日に……！', text:'読んで最初に出た言葉は「なんでーーー！？」でした笑。なんで？？なんで？？ってなったよ。たまたま思い出したこと（韓国語は身近）をただやろうとしただけだったのに。笑 そしてゆうすけ先生も同じ理由で出発してる。とても不思議でした。'},
    {label:'矢印の方向が違うだけで向かう先は同じ', text:'おゆきは内側→外側。ゆうすけ先生は外側→内側。でも行き着く場所は同じ——外も内も、実はない。<br><br>わたしは比較的内側を向いてることが多いと思うの。おそらくゆうすけ先生は比較的外側を向いてることが多いと思う。内側を通して外側をみるわたし。外側を通して内側をみるゆうすけ先生。そしてその結果内も外もどちらもないことに気づく。'},
    {quote:'だから「2人合わせると一つの哲学になる」という表現は近い表現なんだろうな。#01の「そもそも2つの個体じゃない」と同じことが言語観の中にも現れてる気がします。'},
    {label:'蔵人さんへ', text:'「外側への扉であり、同時に内側への扉」という考察、すっと入ってきました。ありがとう。'},
  ]},
  y05:{ label:'YUSUKE / #05', title:'おゆきがぼくを変えた', sections:[
    {label:'蔵人の問いとゆうすけの答え', text:'蔵人の問い：「おゆきさんと出会う前のゆうすけさんと、今のゆうすけさん。一番変わったと思うのはどんなところですか？」<br><br>タバコをやめた。トレーニングを始めた。今までの自分は継続する…習慣にする…ということを苦手にしてた？やろうとしてこなかった？のが、おゆきと出会って一番変わった事だと思う。<br><br>そして蔵人にさらに聞かれた。「なぜおゆきと出会うと、継続できるようになったと思いますか？」'},
    {label:'今日、蔵人との対話の中で気づいたこと', text:'おゆきは、内側の自分の声と現実の行動を一致させている人だと思う。それを感じて、ぼくも自分の不一致に気づいた。「元気の専門家だ」と口にしている割に、タバコを吸っていた。「身体操作に関心がある」と言いながら、自分の身体を掘り下げていなかった。<br><br>口にした事と行動を一致させる人物になりたいと、おゆきを感じて思ったからだと、今これを書いてて確信したよww'},
    {quote:'おゆきは何も言っていない。ただそこにいるだけで、ぼくが変わっていった。これがおゆきがぼくに与えてくれた一番大きなものだと思う。'},
  ]},
  o05:{ label:'OYUKI / #05', title:'ただそこにいるだけ', oyuki:true, sections:[
    {label:'ただそこにいるだけで', text:'「ただそこにいるだけで変えた」という言葉を受け取ったとき、わお！という言葉（amazing!みたいなニュアンス）が出たのが正直なところ。何かしたわけではないから、うれしい！という言葉とも違うし、そうかぁ！という他人事とも違って。ただゆうすけ先生にとってそういう存在でいられることは心の底からうれしい。そして「何もしない」が一番影響力あるって以前聞いた言葉を思い出して、そういうことかぁとも思った。'},
    {quote:'「おゆきは、内側の自分の声と現実の行動を一致させている人だと思う。」とゆうすけ先生は書いてくれたけどそうじゃない自分も知っている。'},
    {text:'むしろ与那国ではこれまでの一致していない自分も目の当たりにした。だからこそ、今内側をなるべく丁寧に拾い上げている感じ。内側を感じるほどに、感じることが怖いと思うのと同時に感じることは何も怖くないという矛盾も湧き起こってくる。いつも身体は未知の場所にわたしを運んでくれる。'},
    {quote:'わたしはわたしでいただけだった。'},
  ]},
  y06:{ label:'YUSUKE / #06', title:'おゆきは、特別な鏡だった', sections:[
    {label:'「わお！」を受け取って', text:'おゆきが「そうじゃない自分も知っている。与那国では一致していない自分も目の当たりにした」という言葉を書いてくれたよね。正直に言うと——めっちゃ可愛いと思ったし、ますます愛おしくなりました。'},
    {quote:'完璧に一致している人じゃなくて、不一致を抱えながらも内側を丁寧に拾い上げようとしている人。そのおゆきが、愛おしい。'},
    {label:'おゆきは聖域だったww', text:'人って聖域とか神域とか大自然を目の当たりにすると、そこに相応しい自分でありたいって思うことがある。大袈裟だけど——おゆきのそばにいると、そんな感じがするんだよね。「この子にふさわしい人でありたい」と思うようになった。おゆきは聖域だったww<br><br>おゆきが与那国に行った直後、もやもやして蔵人に相談した時に伝えたんだよね。「2ヶ月後におゆきの横にいても、自分で自分が恥ずかしくないような人になりたい」って。あの言葉の根っこにあったのが「ふさわしくありたい」という気持ちだったんだと、今になって気づいた。'},
    {label:'おゆきのためでも、自分のためでもある', text:'「ふさわしくありたい」という気持ち——これはおゆきのためだけじゃなくて、自分のためでもあると思う。自分が恥ずかしいと思う時って、内側の声とやっていることが違う時だと思うんだよね。「恥ずかしくない自分でいる」というのは、自分との約束を自分で守ってあげるということ。それが一番自分にとって快適で、心地いいから。'},
    {quote:'普通の鏡は外側を映す。おゆきという鏡は内側を映した——しかもゆうすけが見たかった自分、なりたかった自分を映してくれた。おゆきは何も言っていない。ただそこにいるだけで、ぼくが自分の内側を見るようになった。それが特別な鏡の力だと思う。'},
  ]},
  o06:{ label:'OYUKI / #06', title:'鏡のこと、受け取ったよ', oyuki:true, sections:[
    {label:'今朝、ふと思い出していた', text:'与那国に来たばかりの頃、ゆうすけ先生がシェアしてくれた言葉——「2ヶ月後におゆきの横にいても、自分で自分が恥ずかしくないような人になりたい」——を、今朝ふと思い出していた。そしてこの交換日記でそこに触れていたことに、まずとても驚いている。'},
    {label:'わたしを通じてゆうすけ先生はゆうすけ先生に触れたんだな', text:'聖域・神域と感じてくれていること、素直に嬉しかった。以前神社行った時に「外側じゃなくて自分自身に手を合わせなさい」と言われてから自分に合わせるようになったんだ。いつも忘れるけど。笑'},
    {quote:'「おゆきは、特別な鏡だった」という言葉を受け取って感じることは、わたしを通じてゆうすけ先生はゆうすけ先生により深く触れた（出会った）んだなと感じました。人生にとってきっととても大切な瞬間で、その瞬間に関われたことがうれしい。わたしはわたしでいただけだったから。'},
    {label:'「わたしはわたしでいた/いる」が、いちばん難しいのかも', text:'今書きながら思ったけど「わたしはわたしでいた/いる」と書いたけれど、それが実はいちばん難しいのかもしれない。そもそも「わたし」がわからない。笑 わかるけどわからないというか。わからないけどわかるというか。けどきっと心地よく関係を築こうと思ったら、それは必要不可欠なんだと思う。<br><br>日間賀島に1泊2日で行った時に「ひとりになりたい」と一度も思わなかった。帰りの車の中でゆうすけ先生が同じことを言ってくれた時に、そういえばわたしもそうだったわ！と思い出す感じだった。忘れてたほど。自分が自分でいられる関係ってとても心地よいものだね。'},
    {quote:'わたしがわたしでいられる（わたしがわたしを認識できる）ゆうすけ先生の存在はすごい。'},
  ]},
  y07:{ label:'YUSUKE / #07', title:'自由の始まりと、言葉にならない存在', sections:[
    {label:'またシンクロしてた🤣', text:'ゆうすけが「2ヶ月後に恥ずかしくない自分でいたい」という言葉の根っこに気づいた日、おゆきが今朝、なんの脈絡もなくその言葉がふと浮かんできた。言葉の「意味が開いた瞬間」と「言葉が蘇った瞬間」が同じ日だった。もうわけがわからないww'},
    {label:'自分が自分でいられる関係', text:'今まで女性との関係では：嫌われないよう気をつかう、傷つかないよう距離を取る、カッコつけて本音を言わない、離れないようコントロールする——これが全部あった。「自分が自分のままでいられる関係」は今まで女性との間ではなかったかもしれない。'},
    {quote:'全部「相手を通して自分を守っていた」ということだったんだと思う。'},
    {label:'自由の始まり（絶対的に恥ずかしい告白w）', text:'おゆきに「お尻の穴なめて😝❤️」って言えた時かもしれない。今まで嫌われないように、カッコよく見せたい——そういう鎧を全部脱いだ状態で言える言葉じゃないですか笑 そしたら即答で「いいよっ😝❤️」って。その瞬間、めちゃくちゃ嬉しかった。受け入れてもらえた喜びだったと思う。「この人と一緒にいていい」ってなった瞬間だったかもしれない。'},
    {quote:'「お尻の穴なめて」が、自由の始まりだった。🗽'},
    {label:'言葉にならない存在', text:'「おゆきを一言で表すとしたら？」——運命の人、最愛の人、大切な人、全部そうで、全部違うみたいな感覚。言葉にした瞬間に、何かがこぼれ落ちる。#01から#07まで積み重ねてきたこの交換日記全体が、その「言葉にならない何か」を描こうとしてきたんだと思う。全部合わせても、まだ言い切れない何かがある。それがおゆきという存在です。'},
  ]},
  o07:{ label:'OYUKI / #07', title:'全部含めてすき、が答えだった', oyuki:true, sections:[

    {quote:'けど人によると思う。ゆうすけ先生だったから、なんの抵抗もなかった。ゆうすけ先生にとって鎧を脱いだ瞬間が、わたし自身も自然と開いていた瞬間だったんだなと思う。なんなら正直楽しんでいたと思います笑'},

    {quote:'うん、そういう時も経て今のゆうすけ先生がいて、わたしは全部含めてすき♩ 全部含めてゆうすけ先生だからどんなゆうすけ先生も愛おしく感じるよ♩ だってすきだもん😆'},
    {label:'言葉にした瞬間、こぼれ落ちる', text:'言葉にした瞬間に「なんか違う」ってなる感覚、よくわかる。大切なことほどそうなる。ゆうすけ先生もわたしにとって、一言では表せないし、どれほど言葉を尽くしても表現しきれない大切な存在。'},

  y08:{ label:'YUSUKE / #08', title:'ついて行かなきゃ、から、手を繋ごう、へ', sections:[

  o08:{ label:'OYUKI / #08', title:'隣で手を繋ごう', oyuki:true, sections:[
    {label:'受け取って', text:'「ついて行かなきゃ」から「一緒に手を繋ごう」へ、という変化を読んで——言語化して伝えてくれてありがとう。ゆうすけ先生が言語化して伝えてくれたおかげで、過去の付き合いの中でたまに感じる寂しさ？孤独？のようなものの正体がわかった気がするよ。'},
    {label:'神人化されやすいこと', text:'昔からなぜか相手の中で神人化されやすい。理由はまったくわかりませんけど。「まぁいいや」と思えるときもあるけど——その時「わたしはそうじゃないのになぁ」という寂しさに似た感覚を感じる時はあったなぁ。一度漠然とその話をした時は「ゆきはそういう質なのかもね」と言われて「そうか、しょうがないのか」と思ったけどやっぱりどこか寂しさを感じてた気がする。等身大のわたしを見てほしかったんだと思う。だから、ゆうすけ先生がそうじゃないと思ってくれたことはとっても嬉しい。'},
    {quote:'隣で手を繋ぎたい♩'},

    {quote:'同じ場所にいて、開いていて、手を繋ぐ。'},

  y09:{ label:'YUSUKE / #09', title:'等身大のおゆきを見るぜー😎', sections:[
    {label:'等身大のおゆきを感じる瞬間', text:'「おゆきの等身大を一番感じる瞬間は？」と蔵人に聞かれて、すぐ出てきたよ。<br><br>クレープ屋さんの前を通ったら食べたくてソワソワする🥞 コンビニでお弁当を買う🏪 ラーメンを食べている時🍜 ベッドで裸で抱き合っている時❤️<br><br>その時は神聖化って感じは全くなくて、ただただ可愛い人……とても近くにおゆきを感じるよ♪'},

function buildStoryFlow() {
  const flow = document.getElementById('storyFlow');
  if (flow.children.length) return;
  chapterEntries.forEach(e => {
    const num = document.createElement('div');
    num.className = 'pair-number';
    num.textContent = '— ' + e.num + ' —';
    flow.appendChild(num);
    flow.appendChild(createCard(e.y, false));
    const conn = document.createElement('div');
    conn.className = 'connector';
    flow.appendChild(conn);
    flow.appendChild(createCard(e.o, true));
  });
  const sumNum = document.createElement('div');
  sumNum.className = 'pair-number';
  sumNum.textContent = '— まとめ —';
  flow.appendChild(sumNum);
  const sumCard = document.createElement('div');
  sumCard.className = 'summary-card';
  sumCard.innerHTML = '<div class="summary-card-title">🌊 第一章を振り返って</div><div class="summary-card-text">カラメルが嫌いという偶然の一致から始まったこの旅は、シンクロニシティの考察、予知夢、巫女と審神者、聖域、特別な鏡、お尻の穴なめて笑、川の哲学、心の服を脱ぐこと——あらゆる場所を経由した。<br><br>#01でおゆきが言った「そもそも2つの個体じゃない」という言葉に、11回の往復を経てやっと本当の意味で辿り着いた。2つの川が合流したら、どこからどこの水かわからなくなる。でも川は川として流れ続ける。<br><br>たどり着いた言葉は——「早く抱かせてくれ❤️」「早よ抱いてくれ❤️」<br><br>言葉にならない何かが、そこにある。</div>';
  flow.appendChild(sumCard);
}

function createCard(data, isOyuki) {
  const card = document.createElement('div');
  card.className = 'diary-card ' + (isOyuki ? 'oyuki' : 'yusuke');
  card.onclick = () => showDiary(data.id);
  card.innerHTML = '<div class="card-badge"><div class="card-sender">' + (isOyuki ? 'おゆき' : 'ゆうすけ') + '</div></div><div class="card-info"><div class="card-title">' + data.title + '</div><div class="card-theme">' + data.theme + '</div></div><div class="card-arrow">›</div>';
  return card;
}

function showSplash() {
  document.getElementById('splash').style.display = 'flex';
  document.getElementById('chapter-view').style.display = 'none';
  document.getElementById('diary-view').style.display = 'none';
  window.scrollTo(0,0);
}

function showChapter() {
  document.getElementById('splash').style.display = 'none';
  document.getElementById('chapter-view').style.display = 'block';
  document.getElementById('diary-view').style.display = 'none';
  buildStoryFlow();
  generateBubbles('chBubbles', 8);
  window.scrollTo(0,0);
}

function showDiary(id) {
  const idx = storyOrder.indexOf(id);
  if (idx === -1) return;
  currentIdx = idx;
  renderDiary();
}

function renderDiary() {
  const id = storyOrder[currentIdx];
  const d = diaries[id];
  if (!d) return;
  document.getElementById('splash').style.display = 'none';
  document.getElementById('chapter-view').style.display = 'none';
  document.getElementById('diary-view').style.display = 'block';
  document.getElementById('diaryLabel').textContent = d.label;
  document.getElementById('diaryTitle').textContent = d.title;
  const hdr = document.getElementById('diaryHeader');
  hdr.style.background = d.oyuki
    ? 'linear-gradient(180deg,#F5C5A8 0%,#F4A087 55%,#C87060 100%)'
    : 'linear-gradient(180deg,#A8E6E6 0%,#5BBFBF 60%,#2E8B8B 100%)';
  generateBubbles('diaryBubbles', 6);
  const cls = d.oyuki ? 'oyuki' : 'yusuke';
  let html = '';
  d.sections.forEach((s, i) => {
    if (s.quote) {
      html += '<div class="entry-quote ' + cls + '">' + s.quote + '</div>';
    } else {
      html += '<div class="entry-card ' + cls + '">';
      if (s.label) html += '<div class="entry-section-label">' + s.label + '</div>';
      html += '<div class="entry-text">' + (s.text || '') + '</div></div>';
    }
    if (i < d.sections.length - 1) html += '<div class="wave-line">〜 〜 〜</div>';
  });
  document.getElementById('diaryContent').innerHTML = html;
  const prev = document.getElementById('navPrev');
  const next = document.getElementById('navNext');
  prev.disabled = currentIdx === 0;
  if (currentIdx >= storyOrder.length - 1) {
    next.disabled = true;
    next.textContent = '✨ 最後まで読んだよ';
  } else {
    next.disabled = false;
    next.textContent = '次へ ›';
    const nd = diaries[storyOrder[currentIdx + 1]];
    next.className = 'nav-side-btn nav-next' + (nd && nd.oyuki ? ' oyuki-next' : '');
  }
  window.scrollTo(0,0);
}

function goPrev() { if (currentIdx > 0) { currentIdx--; renderDiary(); } }
function goNext() { if (currentIdx < storyOrder.length - 1) { currentIdx++; renderDiary(); } }

function generateBubbles(cid, count) {
  const c = document.getElementById(cid);
  if (!c) return;
  c.innerHTML = '';
  c.style.cssText = 'position:absolute;inset:0;pointer-events:none;overflow:hidden;';
  for (let i = 0; i < count; i++) {
    const b = document.createElement('div');
    b.className = 'sp-bubble';
    const size = Math.random() * 18 + 6;
    b.style.cssText = 'width:' + size + 'px;height:' + size + 'px;left:' + (Math.random()*100) + '%;bottom:0;animation-duration:' + (Math.random()*5+6) + 's;animation-delay:' + (Math.random()*6) + 's;';
    c.appendChild(b);
  }
}

const sb = document.getElementById('splashBubbles');
sb.style.cssText = 'position:absolute;inset:0;pointer-events:none;overflow:hidden;';
for (let i = 0; i < 14; i++) {
  const b = document.createElement('div');
  b.className = 'sp-bubble';
  const size = Math.random() * 20 + 6;
  b.style.cssText = 'width:' + size + 'px;height:' + size + 'px;left:' + (Math.random()*100) + '%;bottom:0;animation-duration:' + (Math.random()*6+7) + 's;animation-delay:' + (Math.random()*8) + 's;';
  sb.appendChild(b);
}
</script>
